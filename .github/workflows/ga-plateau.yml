name: Plateau stopping sensitivity
on:
  push:
    branches: ["fix/ga-hyperparameters-20261021"]
    paths: ["lab1/plateau_sensitivity.py"]
permissions:
  contents: write
jobs:
  plateau:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Generate supplementary study
        run: python lab1/plateau_sensitivity.py
      - uses: actions/upload-artifact@v4
        with:
          name: iad-plateau-sensitivity
          path: results/plateau_sensitivity/
      - name: Commit supplementary data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/plateau_sensitivity
          git commit -m "results: validate plateau stopping sensitivity"
          git push origin HEAD:fix/ga-hyperparameters-20261021
