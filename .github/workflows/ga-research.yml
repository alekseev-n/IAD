name: Complete GA hyperparameter research

on:
  push:
    branches: ["fix/ga-hyperparameters-20261021"]
    paths:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install reproducible study dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression suite first
        run: python -m unittest discover -s tests -v
      - name: Generate all study runs, statistics and charts
        run: python lab1/experiments.py --output-dir results --matrix-count 6 --repeats 2
      - name: Execute the notebook against generated data
        run: |
          jupyter nbconvert --to notebook --execute lab1/testing.ipynb --output testing_executed.ipynb --ExecutePreprocessor.timeout=3600
          mv lab1/testing_executed.ipynb lab1/testing.ipynb
      - name: Keep reproducible study artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iad-ga-research
          path: |
            results/
            lab1/testing.ipynb
          retention-days: 90
      - name: Commit verified research outputs
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ lab1/testing.ipynb
          git commit -m "results: verified hyperparameter study across three size classes"
          git push origin HEAD:fix/ga-hyperparameters-20261021
